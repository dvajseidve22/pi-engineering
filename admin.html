<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Админ панел</title>
    <link rel="stylesheet" href="./styling/admin.css" />
  </head>
  <body>
    <header>
      <h1>Админ панел</h1>
      <div>
        <span id="who" class="muted"></span>
        <button id="logoutBtn" class="btn">Одјава</button>
      </div>
    </header>

    <main>
      <section class="card">
        <h3>Нов пост</h3>

        <!-- Наслов + Слики -->
        <div class="row">
          <input
            id="title"
            type="text"
            placeholder="Наслов (пример KIA Picanto 1.2 GT)"
            autocomplete="off"
          />
          <input id="image" type="file" accept="image/*" multiple />
        </div>

        <!-- KM + Year + Цена (numeric CHF) -->
        <div class="row-3">
          <input
            id="km"
            type="number"
            inputmode="numeric"
            placeholder="KM (пример 5420)"
            min="0"
            step="1"
          />
          <input
            id="year"
            type="number"
            inputmode="numeric"
            placeholder="Година (пример 2024)"
            min="1980"
            max="2099"
            step="1"
          />
          <div>
            <input
              id="price"
              type="number"
              inputmode="numeric"
              placeholder="Цена во CHF (пример 23000)"
              min="0"
              step="100"
            />
            <div id="pricePreview" class="preview"></div>
          </div>
        </div>

        <!-- Гориво + Менувач -->
        <div class="row-3">
          <select id="fuel">
            <option value="">Гориво (опц.)</option>
            <option>Benzin</option>
            <option>Diesel</option>
            <option>Hybrid</option>
            <option>Elektro</option>
            <option>LPG</option>
            <option>CNG</option>
          </select>
          <select id="gearbox">
            <option value="">Менувач (опц.)</option>
            <option>Manuell</option>
            <option>Automatik</option>
          </select>
          <div></div>
        </div>

        <textarea id="description" placeholder="Опис..."></textarea>

        <div class="bar">
          <button id="uploadBtn" class="btn primary">Објави</button>
          <!-- при уредување тука ќе се појави „Откажи“ -->
          <div id="msg" class="muted"></div>
        </div>
      </section>

      <section class="card">
        <h3>Постови</h3>
        <div id="posts" class="grid"></div>
      </section>
    </main>

    <script type="module">
      import { supabase } from "./supabase-config.js";

      // ---- DOM refs ----
      const who = document.getElementById("who");
      const logoutBtn = document.getElementById("logoutBtn");
      const uploadBtn = document.getElementById("uploadBtn");
      const titleInput = document.getElementById("title");
      const descInput = document.getElementById("description");
      const kmInput = document.getElementById("km");
      const yearInput = document.getElementById("year");
      const priceInput = document.getElementById("price");
      const pricePreview = document.getElementById("pricePreview");
      const fuelInput = document.getElementById("fuel");
      const gearboxInput = document.getElementById("gearbox");
      const fileInput = document.getElementById("image");
      const postsDiv = document.getElementById("posts");
      const msg = document.getElementById("msg");

      // ---- local state ----
      let editingId = null; // null => create; number => edit
      let editingImages = []; // стари слики за тековен edit
      let lastPosts = []; // кеш од селектирани постови
      let realtimeChannel = null;

      // ---- helpers ----
      const fmtCHF = (n) =>
        Number.isFinite(n)
          ? "CHF " +
            new Intl.NumberFormat("de-CH", { maximumFractionDigits: 0 }).format(
              n
            )
          : "";

      const formatNumber = (n) => {
        try {
          return new Intl.NumberFormat("mk-MK").format(n);
        } catch {
          return String(n);
        }
      };

      const escapeHtml = (s) =>
        String(s ?? "").replace(
          /[&<>\"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );

      function ensureCancelBtn(visible) {
        let cancel = document.getElementById("cancelEditBtn");
        if (visible) {
          if (!cancel) {
            cancel = document.createElement("button");
            cancel.id = "cancelEditBtn";
            cancel.className = "btn";
            cancel.style.marginLeft = "8px";
            cancel.textContent = "Откажи";
            uploadBtn.parentElement.insertBefore(cancel, msg);
            cancel.addEventListener("click", resetForm);
          }
          cancel.style.display = "";
        } else if (cancel) {
          cancel.style.display = "none";
        }
      }

      function setCreateMode() {
        editingId = null;
        editingImages = [];
        uploadBtn.textContent = "Објави";
        uploadBtn.classList.add("primary");
        ensureCancelBtn(false);
      }

      function setEditMode(id) {
        editingId = id;
        uploadBtn.textContent = "Зачувај измени";
        uploadBtn.classList.remove("primary");
        ensureCancelBtn(true);
      }

      function resetForm() {
        titleInput.value = "";
        descInput.value = "";
        kmInput.value = "";
        yearInput.value = "";
        priceInput.value = "";
        pricePreview.textContent = "";
        fuelInput.value = "";
        gearboxInput.value = "";
        fileInput.value = "";
        msg.textContent = "";
        setCreateMode();
      }

      function validate(isEdit) {
        const title = titleInput.value.trim();
        const description = descInput.value.trim();
        const files = fileInput.files;
        if (!title || !description || (!files.length && !isEdit)) {
          msg.textContent =
            "Пополнете ги задолжителните полиња (наслов, опис и слики).";
          return false;
        }
        return true;
      }

      priceInput.addEventListener("input", () => {
        const n = Number(priceInput.value || "");
        pricePreview.textContent = fmtCHF(n);
      });

      async function uploadImagesAndGetUrls(files) {
        const urls = [];
        for (const file of files) {
          const safe = `${Date.now()}_${file.name}`.replace(/\s+/g, "_");
          const { error: upErr } = await supabase.storage
            .from("images")
            .upload(safe, file, { cacheControl: "3600", upsert: false });
          if (upErr) throw new Error("Грешка при upload: " + upErr.message);
          const { data } = supabase.storage.from("images").getPublicUrl(safe);
          urls.push(data.publicUrl);
        }
        return urls;
      }

      // ---- CRUD ----
      // ---- CRUD ----
      async function createOrUpdate() {
        msg.textContent = "";
        const isEdit = editingId !== null;

        if (!validate(isEdit)) return;

        const kmValue = kmInput.value.trim()
          ? Number(kmInput.value.trim())
          : null;
        const yearValue = yearInput.value.trim()
          ? Number(yearInput.value.trim())
          : null;
        const priceVal = priceInput.value.trim()
          ? Number(priceInput.value.trim())
          : null;

        const payload = {
          title: titleInput.value.trim(),
          description: descInput.value.trim(),
          km: kmValue,
          year: yearValue,
          price: priceVal,
          fuel: fuelInput.value || null,
          gearbox: gearboxInput.value || null,
          images: [],
        };

        try {
          // слики
          let imageUrls = [];
          if (fileInput.files.length > 0) {
            const newUrls = await uploadImagesAndGetUrls(fileInput.files);
            imageUrls = isEdit ? [...editingImages, ...newUrls] : newUrls;
          } else if (isEdit) {
            imageUrls = [...editingImages];
          }
          payload.images = imageUrls;

          if (!isEdit) {
            const { data, error } = await supabase
              .from("posts")
              .insert([payload])
              .select(); // врати нов ред

            if (error) throw error;
            msg.textContent = "Објавено ✔";
          } else {
            // АКО id ти е uuid -> користи .eq("id", editingId) без Number()
            const targetId = Number(editingId);

            const { data, error } = await supabase
              .from("posts")
              .update(payload)
              .eq("id", targetId)
              .select("id,title,description,images,km,year,price,fuel,gearbox"); // врати ажурираниот ред

            if (error) throw error;

            if (!data || data.length !== 1) {
              msg.textContent =
                "Грешка: не беше ажуриран ниту еден ред (провери ID или RLS политики).";
              console.warn(
                "UPDATE returned",
                data,
                "for editingId=",
                editingId
              );
              return;
            }

            // По желба: веднаш освежи кеш за instant UI
            const updated = data[0];
            const i = lastPosts.findIndex((x) => x.id === updated.id);
            if (i !== -1) lastPosts[i] = updated;

            msg.textContent = "Сочувано ✔";
          }

          resetForm();
          await loadPosts(); // сигурен рефреш од база
        } catch (e) {
          console.error(e);
          msg.textContent = "Грешка: " + (e?.message || e);
        }
      }

      async function deletePost(id) {
        if (!confirm("Сигурно сакаш да го избришеш постот?")) return;
        const { error } = await supabase.from("posts").delete().eq("id", id);
        if (error) alert(error.message);
        else {
          if (editingId === id) resetForm();
          loadPosts();
        }
      }

      function startEdit(p) {
        titleInput.value = p.title || "";
        descInput.value = p.description || "";
        kmInput.value = p.km ?? "";
        yearInput.value = p.year ?? "";
        priceInput.value = p.price ?? "";
        pricePreview.textContent =
          p.price != null ? fmtCHF(Number(p.price)) : "";
        fuelInput.value = p.fuel || "";
        gearboxInput.value = p.gearbox || "";
        fileInput.value = "";

        editingImages = Array.isArray(p.images)
          ? p.images.slice()
          : p.images
          ? [p.images]
          : [];
        setEditMode(p.id);
        msg.textContent = `Уредување на пост #${p.id} — смени било што; новите слики ќе се додадат кон постоечките.`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function loadPosts() {
        postsDiv.innerHTML = `<p class="muted">Вчитувам…</p>`;
        const { data: posts, error } = await supabase
          .from("posts")
          .select("id,title,description,images,km,year,price,fuel,gearbox")
          .order("id", { ascending: false });

        if (error) {
          console.error("Supabase select error:", error);
          postsDiv.innerHTML = `<p class="muted">Грешка: ${escapeHtml(
            error.message
          )}</p>`;
          return;
        }
        if (!posts || posts.length === 0) {
          postsDiv.innerHTML = `<p class="muted">Нема објави засега.</p>`;
          return;
        }

        lastPosts = posts;

        postsDiv.innerHTML = posts
          .map((p, idx) => {
            const imgs = (
              Array.isArray(p.images) ? p.images : [p.images || ""]
            ).filter(Boolean);
            const km = p.km ?? null;
            const year = p.year ?? null;

            const priceHtml =
              p.price != null && !Number.isNaN(Number(p.price))
                ? `<span class="badge">${fmtCHF(Number(p.price))}</span>`
                : "";

            const fuelHtml = p.fuel
              ? `<span class="badge">${escapeHtml(p.fuel)}</span>`
              : "";
            const gboxHtml = p.gearbox
              ? `<span class="badge">${escapeHtml(p.gearbox)}</span>`
              : "";

            return `
              <article class="post">
                ${imgs.map((u) => `<img src="${u}" alt="">`).join("")}
                <div class="p">
                  <strong>${escapeHtml(p.title)}</strong>
                  <div class="meta">
                    ${year ? `<span>Год.: ${year}</span>` : ""}
                    ${km !== null ? `<span>KM: ${formatNumber(km)}</span>` : ""}
                    ${priceHtml}${fuelHtml}${gboxHtml}
                  </div>
                  <p class="muted">${escapeHtml(p.description)}</p>
                  <div class="bar">
                    <button class="btn" data-edit-idx="${idx}">Измени</button>
                    <button class="btn danger" data-del-id="${
                      p.id
                    }">Избриши</button>
                  </div>
                </div>
              </article>`;
          })
          .join("");

        // bind delete
        postsDiv.querySelectorAll("[data-del-id]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const id = Number(e.currentTarget.getAttribute("data-del-id"));
            deletePost(id);
          });
        });

        // bind edit
        postsDiv.querySelectorAll("[data-edit-idx]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const idx = Number(e.currentTarget.getAttribute("data-edit-idx"));
            const p = lastPosts[idx];
            startEdit(p);
          });
        });
      }

      // ---- init (no top-level await) ----
      async function init() {
        try {
          const { data: sessionRes } = await supabase.auth.getSession();
          const session = sessionRes?.session;
          if (!session) {
            location.href = "login.html";
            return;
          }
          who.textContent = session.user.email;
        } catch (e) {
          console.error(e);
          location.href = "login.html";
          return;
        }

        logoutBtn.addEventListener("click", async () => {
          await supabase.auth.signOut();
          location.href = "login.html";
        });

        uploadBtn.addEventListener("click", createOrUpdate);

        // realtime subscription (Supabase JS v2 сигнатура)
        realtimeChannel = supabase
          .channel("public:posts")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "posts" },
            () => {
              // не користиме payload; само рефреш
              loadPosts();
            }
          )
          .subscribe((status) => {
            // optional: log status if needed
            // console.log("realtime status:", status);
          });

        setCreateMode();
        await loadPosts();
      }

      init();
    </script>
  </body>
</html>
